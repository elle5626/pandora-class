<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>數字輪盤</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    #wheelContainer {
      position: relative;
      width: 500px;
      height: 500px;
      margin: 20px auto;
    }
    #wheelCanvas {
      border-radius: 50%;
      width: 500px;
      height: 500px;
    }
    #pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 30px solid red;
    }
    #publicControls button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 20px;
    }
    #resultText {
      font-size: 18px;
      margin-top: 15px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>數字輪盤</h1>
  <div id="wheelContainer">
    <div id="pointer"></div>
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
  </div>
  <div id="publicControls">
    <button id="spinButton">Spin</button>
  </div>
  <div id="resultText"></div>
  
  <script>
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const numberOfSectors = 86;
    const sectorAngle = 360 / numberOfSectors;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) - 10;
    let currentRotation = 0;
    let spinning = false;
    
    // 預設中獎號碼（範例，可依需求修改，數值需介於 1 至 86）
    const presetNumbers = [33, 72, 17, 50, 29, 44, 52, 34, 37, 8];
    let presetIndex = 0;
    
    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < numberOfSectors; i++) {
        let startAngleDeg = -sectorAngle / 2 + i * sectorAngle;
        let endAngleDeg = startAngleDeg + sectorAngle;
        let startAngle = startAngleDeg * Math.PI / 180;
        let endAngle = endAngleDeg * Math.PI / 180;
        
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle, false);
        ctx.fillStyle = (i % 2 === 0) ? "#f8b500" : "#fceabb";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.stroke();
        
        ctx.save();
        let textAngle = (startAngle + endAngle) / 2;
        let textRadius = radius * 0.65;
        let textX = centerX + textRadius * Math.cos(textAngle);
        let textY = centerY + textRadius * Math.sin(textAngle);
        ctx.translate(textX, textY);
        ctx.rotate(textAngle + Math.PI / 2);
        ctx.fillStyle = "#000";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(i + 1, 0, 0);
        ctx.restore();
      }
    }
    
    drawWheel();
    
    document.getElementById("spinButton").addEventListener("click", function() {
      if (spinning) return;
      spinning = true;
      document.getElementById("resultText").innerText = "";
      
      let targetNumber;
      // 若預設號碼未用盡，則依序取出；否則隨機選取
      if (presetIndex < presetNumbers.length) {
        targetNumber = presetNumbers[presetIndex];
        presetIndex++;
      } else {
        targetNumber = Math.floor(Math.random() * numberOfSectors) + 1;
      }
      
      // 計算目標轉動角度：使得目標數字扇區中心對齊指針（上方）
      let targetRotationMod = (360 - (targetNumber - 1) * sectorAngle) % 360;
      let extraRotations = 5 * 360;
      let currentMod = currentRotation % 360;
      let additionalRotation = targetRotationMod - currentMod;
      if (additionalRotation < 0) {
        additionalRotation += 360;
      }
      let totalRotationToAdd = extraRotations + additionalRotation;
      let newRotation = currentRotation + totalRotationToAdd;
      
      canvas.style.transition = "transform 5s cubic-bezier(0.33, 1, 0.68, 1)";
      canvas.style.transform = "rotate(" + newRotation + "deg)";
      
      canvas.addEventListener("transitionend", function handler() {
        canvas.removeEventListener("transitionend", handler);
        currentRotation = newRotation;
        spinning = false;
        document.getElementById("resultText").innerText = targetNumber;
      });
    });
  </script>
</body>
</html>
